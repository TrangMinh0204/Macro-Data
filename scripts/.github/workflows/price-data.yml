name: Price Data (Job B)

on:
  schedule:
    # 11:15 UTC = 18:15 giờ VN (UTC+7), các ngày thứ Hai–thứ Sáu
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Tải & chọn ngày dữ liệu (T1)
        run: python scripts/price_collector.py

      - name: Xác nhận PRICE_DATE
        run: echo "Ngày dữ liệu đã chọn: $PRICE_DATE"

      # Các bước T2 (parse -> cache CSV), T3 (snapshot) sẽ nối thêm ở đây
      # trong các lần giao code kế tiếp — T1 dừng lại sau bước tải + chọn ngày.
