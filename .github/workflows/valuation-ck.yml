name: T4f - Valuation Pack Chung Khoan

on:
  workflow_dispatch:
  push:
    paths:
      - "data/fundamentals/CK/**"
      - "config/valuation_ck.yml"
      # LƯU Ý: sửa scripts/valuation_ck.py KHÔNG tự trigger —
      # chạy tay (workflow_dispatch) 1 lần sau khi sửa code.

permissions:
  contents: write

concurrency:
  group: valuation-ck
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install pyyaml

      - name: Run valuation
        run: python scripts/valuation_ck.py

      - name: Commit & push (retry khi bi tu choi)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/packs/valuation_ck_*.md
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit."
            exit 0
          fi
          git commit -m "T4f: cap nhat Valuation Pack chung khoan [skip ci]"
          # Retry toi da 5 lan — nhieu workflow cung ghi data/packs/
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (lan $i)"; exit 0
            fi
            SLEEP=$((RANDOM % 6 + 2))
            echo "Push bi tu choi, fetch+rebase va thu lai sau ${SLEEP}s (lan $i/5)..."
            sleep $SLEEP
            git fetch origin
            git rebase origin/${GITHUB_REF_NAME} || { git rebase --abort; git pull --rebase origin ${GITHUB_REF_NAME}; }
          done
          echo "Push that bai sau 5 lan thu."
          exit 1
