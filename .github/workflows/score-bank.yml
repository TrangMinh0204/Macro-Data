name: Score Ngan Hang (T4c)

on:
  push:
    paths:
      - 'data/packs/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  score-bank:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tinh diem co hoc Q-G-V-T-D cho cac ma ngan hang
        run: python scripts/score_bank.py

      - name: Commit ket qua cham diem
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/packs
          git add data/packs
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit"
          else
            git commit -m "Cap nhat diem co hoc Q-G-V-T-D ngan hang"
            git push
          fi
