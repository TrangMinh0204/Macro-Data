name: Price Data (Job B)

on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Tai va chon ngay du lieu
        run: python scripts/price_collector.py

      - name: Xac nhan PRICE_DATE
        run: echo "Ngay du lieu da chon $PRICE_DATE"
