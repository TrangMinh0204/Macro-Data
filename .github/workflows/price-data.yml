name: Price Data (Job B)

on:
  schedule:
    - cron: "15 11 * * 1-5"
  workflow_dispatch:
    inputs:
      override_index_ok:
        description: "CHI DUNG KHI DA TU KIEM CHUNG: bo qua kiem tra ngay VNINDEX (dung khi xac nhan la loi nhan ngay tu CafeF, khong phai thieu du lieu that). KHONG bat mac dinh."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch-price:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests pyyaml

      - name: Tai va chon ngay du lieu
        run: python scripts/price_collector.py

      - name: Parse va cache CSV
        env:
          OVERRIDE_INDEX_OK: ${{ inputs.override_index_ok }}
        run: python scripts/parse_prices.py

      - name: Sinh market snapshot
        run: python scripts/market_snapshot.py

      - name: Sinh Price Pack
        run: python scripts/price_pack.py

      - name: Commit du lieu gia va data-health
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/prices data/packs output
          git add data/prices data/packs
          for f in output/data-health.md output/market-snapshot.md output/ohlc-anomalies.md; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Khong co thay doi de commit"
          else
            git commit -m "Cap nhat gia/snapshot/pack/data-health ${PRICE_DATE}"
            git push
          fi
